<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#fffdf7"/>
  <meta name="description" content="Sai Sathwika — fresh dairy, delivered to your doorstep."/>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="icon" type="image/svg+xml" href="./icon.svg"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <title>Sai Sathwika | Freshness at Your Doorstep</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fffdf7!important;color:#244b30}html{background-color:#fffdf7}body{min-height:100dvh;background:#fffdf7!important;overscroll-behavior-y:none}#root{min-height:100dvh;background:#fffdf7;isolation:isolate}
    #root{min-height:100vh}
    #app-boot-screen{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,#ffffff 0%,#f1f7e9 52%,#e5f0dd 100%);color:#19472d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;opacity:1;transition:opacity .46s cubic-bezier(.22,.75,.25,1);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
    #app-boot-screen:before,#app-boot-screen:after{content:"";position:absolute;width:min(86vw,520px);aspect-ratio:1;border:1px solid #2e7d4620;border-radius:50%;pointer-events:none}
    #app-boot-screen:after{width:min(68vw,400px);border-color:#2e7d4618}
    #app-boot-screen .boot-logo{position:relative;width:86px;height:86px;filter:drop-shadow(0 14px 28px #52734a24);animation:none}
    #app-boot-screen .boot-name{position:relative;margin-top:25px;color:#19472d;font-family:Georgia,serif;font-weight:700;font-size:31px;letter-spacing:.01em}
    #app-boot-screen .boot-tagline{position:relative;margin-top:9px;font-size:9px;font-weight:700;letter-spacing:.24em;color:#64836a}
    #app-boot-screen .boot-track{position:relative;width:112px;height:3px;margin-top:34px;overflow:hidden;border-radius:9px;background:#dce9d8}
    #app-boot-screen .boot-track span{display:block;width:42%;height:100%;border-radius:9px;background:linear-gradient(90deg,#1c8b4b,#d5ad52);animation:boot-progress 1.35s ease-in-out infinite}
    #app-boot-screen .boot-caption{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));font-size:11px;color:#718773}
    #app-boot-error{display:none;position:relative;z-index:2;width:min(88vw,380px);margin-top:22px;padding:16px 18px;border:1px solid #ffffff30;border-radius:16px;background:#ffffff12;backdrop-filter:blur(14px);text-align:center;color:#19472d}
    #app-boot-error p{margin:0 0 12px;font-size:12px;line-height:1.6;color:#64836a}
    #app-boot-error button{border:0;border-radius:10px;background:#17643a;color:#fff;padding:10px 18px;font:700 12px system-ui;cursor:pointer}
    #app-boot-screen.app-boot-screen-hidden{opacity:0;pointer-events:none}
    @keyframes boot-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes boot-progress{0%{transform:translateX(-115%)}100%{transform:translateX(290%)}}
    @media(prefers-reduced-motion:reduce){#app-boot-screen .boot-logo,#app-boot-screen .boot-track span{animation:none}}
    #app-boot-screen:before,#app-boot-screen:after{display:none}#app-boot-screen .boot-name,#app-boot-screen .boot-tagline,#app-boot-screen .boot-track,#app-boot-screen .boot-caption,#app-boot-screen .boot-credit{display:none!important}#app-boot-screen .boot-caption,#app-boot-screen .boot-name,#app-boot-screen .boot-tagline,#app-boot-screen .boot-track{display:none!important}
    #app-boot-screen .boot-credit{display:none!important}
    #app-boot-screen .boot-credit strong{color:#28643a}
    #app-boot-screen .boot-credit span{font-size:9px;color:#94a08d}
  </style>
  <script>
    (() => {
      const key = 'sai-sathwika-diagnostics-v1';
      const redact = (value) => String(value || '').replace(/(access_token|refresh_token|client_secret|code_verifier|apikey)(=|:)([^&\s]+)/gi, '$1$2[redacted]').slice(0, 5000);
      const showBootError = (message) => {
        const errorPanel = document.getElementById('app-boot-error');
        const errorText = document.getElementById('app-boot-error-message');
        const caption = document.getElementById('app-boot-caption');
        if (caption) caption.textContent = 'Sai Sathwika could not start correctly';
        if (errorText) errorText.textContent = message || 'A startup problem was detected. Your error details have been saved on this device.';
        if (errorPanel) errorPanel.style.display = 'block';
      };
      const capture = (message, stack) => {
        try {
          const previous = JSON.parse(localStorage.getItem(key) || '[]');
          const records = Array.isArray(previous) ? previous : [];
          records.push({
            id: String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8),
            occurred_at: new Date().toISOString(),
            level: 'error',
            platform: 'webview-boot',
            message: redact(message),
            stack: stack ? redact(stack) : null
          });
          localStorage.setItem(key, JSON.stringify(records.slice(-60)));
        } catch (_) {}
        showBootError('We found a startup problem and saved its details. Tap “Try again” to reload the store.');
      };
      window.addEventListener('error', (event) => capture(event.message || 'A startup script failed to load', event.error && event.error.stack));
      window.addEventListener('unhandledrejection', (event) => {
        const reason = event.reason;
        capture(reason && reason.message ? reason.message : String(reason || 'Unhandled startup promise'), reason && reason.stack);
      });
      window.setTimeout(() => {
        if (document.body.dataset.appReady !== 'true') {
          showBootError('The store is taking longer than expected to load. Your app is still here; try reloading it.');
        }
      }, 18000);
    })();
  </script>
</head>
<body>
  <div id="app-boot-screen" role="status" aria-live="polite" aria-label="Starting Sai Sathwika">
    <svg class="boot-logo" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="boot-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#248a4a"/><stop offset=".58" stop-color="#17643a"/><stop offset="1" stop-color="#c9a34a"/></linearGradient>
      </defs>
      <rect x="4" y="4" width="112" height="112" rx="34" fill="url(#boot-bg)" stroke="#a5f3fc" stroke-opacity=".55"/>
      <path d="M82 31C70 23 40 26 34 42c-8 22 22 22 39 31 16 8 7 29-17 29-10 0-20-4-27-10" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
      <path d="M60 100c-12-10-24-10-36-6m36 6c12-10 24-10 36-6m-36 6v10" fill="none" stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M94 14l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff"/>
    </svg>
    <div class="boot-name">Sai Sathwika</div>
    <div class="boot-tagline">FRESHNESS AT YOUR DOORSTEP</div>
    <div class="boot-track"><span></span></div>
    <div id="app-boot-caption" class="boot-caption">A little freshness is on its way…</div>
    <div class="boot-credit">Made with love by <strong>Krishna Karthik</strong><span>Created in Andhra Pradesh, India</span></div>
    <div id="app-boot-error" role="alert" aria-live="assertive">
      <p id="app-boot-error-message">We found a startup problem. Your error details will be saved on this device.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
