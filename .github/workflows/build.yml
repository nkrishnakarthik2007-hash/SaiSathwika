name: Build Sai Sathwika
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sai-sathwika-main-build
  cancel-in-progress: true

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Generate branded app icons and splash assets
        run: |
          node scripts/generate-brand-assets.mjs
          npx capacitor-assets generate --android
      - name: Sync Android app
        run: npx cap sync android
      - name: Set increasing Android app version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/set-android-version.mjs
      - name: Check whether permanent Android signing is configured
        id: signing-check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure permanent Android signing
        if: steps.signing-check.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          node scripts/configure-android-signing.mjs
      - name: Build release APK with permanent signing
        if: steps.signing-check.outputs.enabled == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: app/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Build debug APK (temporary testing only)
        if: steps.signing-check.outputs.enabled != 'true'
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Name installable APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk saisathwika.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk saisathwika.apk
          fi
      - name: Upload website build
        uses: actions/upload-artifact@v4
        with:
          name: sai-sathwika-website
          path: dist
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sai-sathwika-android-debug
          path: saisathwika.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Sai Sathwika v0.1.${{ github.run_number }}
          body: |
            Android test APK (debug-signed) built from commit ${{ github.sha }}.

            Install saisathwika.apk on your Android device. This is a debug-signed testing build.
          prerelease: true
          files: saisathwika.apk
