name: Build Sai Sathwika
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sai-sathwika-main-build
  cancel-in-progress: true

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare build diagnostics
        run: mkdir -p diagnostics
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: |
          set -o pipefail
          npm install 2>&1 | tee diagnostics/npm-install.log
      - name: Validate Supabase app configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing VITE_SUPABASE_URL or VITE_SUPABASE_PUBLISHABLE_KEY repository secret. Add both under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Supabase app configuration is present."
      - name: Build website
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee diagnostics/web-build.log
      - name: Add Android platform
        run: |
          set -o pipefail
          npx cap add android 2>&1 | tee diagnostics/capacitor-add-android.log
      - name: Configure Android OAuth and native updater
        run: |
          set -o pipefail
          node scripts/configure-android-deeplink.mjs 2>&1 | tee diagnostics/android-native-integration.log
      - name: Generate branded app icons and splash assets
        run: |
          set -o pipefail
          node scripts/generate-brand-assets.mjs 2>&1 | tee diagnostics/brand-assets.log
          npx capacitor-assets generate --android 2>&1 | tee -a diagnostics/brand-assets.log
      - name: Sync Android app
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee diagnostics/capacitor-sync.log
      - name: Set increasing Android app version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          node scripts/set-android-version.mjs 2>&1 | tee diagnostics/android-version.log
      - name: Check whether permanent Android signing is configured
        id: signing-check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "build_type=permanent-signed" >> "$GITHUB_OUTPUT"
          elif [ -z "$ANDROID_KEYSTORE_BASE64" ] && [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && [ -z "$ANDROID_KEY_ALIAS" ] && [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "build_type=debug-testing" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Android signing secrets are only partially configured. Add all four secrets or remove the incomplete set."
            exit 1
          fi
      - name: Configure permanent Android signing
        if: steps.signing-check.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          node scripts/configure-android-signing.mjs 2>&1 | tee diagnostics/android-signing.log
      - name: Build release APK with permanent signing
        if: steps.signing-check.outputs.enabled == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../diagnostics/android-release-build.log
      - name: Build debug APK (temporary testing only)
        if: steps.signing-check.outputs.enabled != 'true'
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../diagnostics/android-debug-build.log
      - name: Name installable APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk SaiSathwika.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk SaiSathwika.apk
          fi
      - name: Upload website build
        uses: actions/upload-artifact@v4
        with:
          name: sai-sathwika-website
          path: dist
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sai-sathwika-android-${{ steps.signing-check.outputs.build_type }}
          path: SaiSathwika.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Sai Sathwika v0.1.${{ github.run_number }}
          body: |
            ${{ steps.signing-check.outputs.enabled == 'true' && 'Permanent-signature Android APK' || 'Debug-signed Android testing APK' }} built from commit ${{ github.sha }}.

            ${{ steps.signing-check.outputs.enabled == 'true' && 'This APK uses the configured permanent signing key and is suitable for in-place updates from installations signed with the same key.' || 'This is a temporary debug-signed testing build. Android may reject it as an update over an existing installation signed with a different key.' }}

            Installable file: SaiSathwika.apk
          prerelease: true
          files: SaiSathwika.apk

      - name: Capture build diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          {
            echo "Project: Sai Sathwika"
            echo "Workflow run: ${{ github.run_number }}"
            echo "Commit: ${{ github.sha }}"
            echo "Event: ${{ github.event_name }}"
            echo "Runner: ${{ runner.os }}"
            echo "Node: $(node --version 2>/dev/null || echo unavailable)"
            echo "NPM: $(npm --version 2>/dev/null || echo unavailable)"
            echo "Java:"
            java -version 2>&1 || true
            if [ -f SaiSathwika.apk ]; then
              echo "APK:"
              ls -lh SaiSathwika.apk
              sha256sum SaiSathwika.apk
            else
              echo "APK was not produced."
            fi
          } > diagnostics/build-summary.txt 2>&1
      - name: Archive build logs for future troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sai-sathwika-build-logs-${{ github.run_number }}
          path: diagnostics
          retention-days: 90
          if-no-files-found: warn

  pages:
    needs: web-and-android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download website build
        uses: actions/download-artifact@v4
        with:
          name: sai-sathwika-website
          path: dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy customer storefront
        id: deployment
        uses: actions/deploy-pages@v4

  windows-admin:
    needs: web-and-android
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate Windows admin app icons
        run: |
          npm install
          node scripts/generate-brand-assets.mjs
        shell: bash
      - name: Install Tauri CLI
        working-directory: windows-admin
        run: npm install
      - name: Set Windows app version
        working-directory: windows-admin
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: npm run set-version
      - name: Generate branded Windows icons
        working-directory: windows-admin
        run: npm run icon
      - name: Build Windows MSI and setup EXE
        working-directory: windows-admin
        run: npm run build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: sai-sathwika-windows-admin-${{ github.run_number }}
          path: |
            windows-admin/src-tauri/target/release/bundle/msi/*.msi
            windows-admin/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish Windows installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Sai Sathwika v0.1.${{ github.run_number }}
          overwrite_files: true
          files: |
            windows-admin/src-tauri/target/release/bundle/msi/*.msi
            windows-admin/src-tauri/target/release/bundle/nsis/*.exe
