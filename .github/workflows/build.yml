name: Build Sai Sathwika
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sai-sathwika-main-build
  cancel-in-progress: true

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Generate branded app icons and splash assets
        run: |
          node scripts/generate-brand-assets.mjs
          npx capacitor-assets generate --android
      - name: Sync Android app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload website build
        uses: actions/upload-artifact@v4
        with:
          name: sai-sathwika-website
          path: dist
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sai-sathwika-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Sai Sathwika v0.1.${{ github.run_number }}
          body: |
            Android debug APK built from commit ${{ github.sha }}.

            Install this APK on your Android device. This is a debug build for testing.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
